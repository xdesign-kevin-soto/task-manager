<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <h1>Task Manager</h1>
</header>
<main class="main-content">
    <section class="form-section">
        <form th:action="@{/add}" method="post" th:object="${task}">
            <label for="title">I need to</label>
            <input type="text" id="title" name="title" th:field="*{title}" placeholder="feed the dog" required>
            <button type="submit">Add Task</button>
        </form>
    </section>
    <section class="task-list">
        <h2>Current Tasks</h2>
        <ul>
            <li th:each="task : ${tasks}" class="task-item">
                <span th:text="${task.title}" class="task-title">Task title</span>
                <form th:action="@{/tasks/done}" method="post" style="display:inline">
                    <input type="hidden" name="id" th:value="${task.id}"/>
                    <button type="submit">Done</button>
                </form>
            </li>
        </ul>
    </section>

    <!-- Add Funds Navigation -->
    <section class="form-section" style="border-top: 2px solid #E0E0E0; padding-top: 2rem; margin-top: 2rem;">
        <h2>Add Funds (Demo)</h2>
        <p>Demo pages showing Online Banking warning banner implementation:</p>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <a href="/add-funds" class="payment-method-tile" style="max-width: 200px; font-size: 0.9rem;">
                <span class="payment-method-icon" style="font-size: 1.5rem;">💰</span>
                <h3 style="font-size: 1rem;">Core Add Funds</h3>
                <p style="font-size: 0.8rem;">Online Banking tile</p>
            </a>
            <a href="/add-funds/ftd" class="payment-method-tile" style="max-width: 200px; font-size: 0.9rem;">
                <span class="payment-method-icon" style="font-size: 1.5rem;">🏢</span>
                <h3 style="font-size: 1rem;">FTD Rebranded</h3>
                <p style="font-size: 0.8rem;">FTD flow with tile</p>
            </a>
            <a href="/add-funds/saved-methods" class="payment-method-tile" style="max-width: 200px; font-size: 0.9rem;">
                <span class="payment-method-icon" style="font-size: 1.5rem;">💾</span>
                <h3 style="font-size: 1rem;">Saved Methods</h3>
                <p style="font-size: 0.8rem;">Saved online banking</p>
            </a>
        </div>
    </section>
</main>
<footer>
    <p>© 2025 CreateFuture</p>
</footer>
</body>
</html>
